<svg class="ag-scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 254" role="img" aria-label="An illustrative hunt. From a ransomware report, a supervisor agent splits the hunt among narrow agents, each given only the tools and context its one job needs, because a local model does best with one job: forming a hypothesis, writing and running the detection logic, reporting. The Hypothesis agent&#39;s hunch is that attackers hide in scheduled tasks. The Detection agent&#39;s first search, for schtasks.exe, comes back empty, and empty does not mean safe: tasks made through the Task Scheduler API never launch schtasks.exe, so it rewrites the query, checks it and searches the event logs another way, around event 4698, a task being created. That returns 32 tasks created; one is unusual, \WinTaskUpdate, on one host and not in the baseline. The Reporting agent writes it up as a lead with the evidence attached, and only a human analyst makes the call."><rect x=".5" y=".5" width="639" height="253" rx="12" fill="#061214" stroke="#24464b"/><g class="ag-head"><g class="ag-logo"><rect x="16" y="12" width="14.4" height="14.4" rx="3.6" fill="#0b1b1e" stroke="#24464b"/><g transform="translate(18.4 14.4) scale(0.396)"><path d="M14 2.2A10 10 0 0 1 21.8 10L18.97 10A7.25 7.25 0 0 0 14 5.03ZM21.8 14A10 10 0 0 1 14 21.8L14 18.97A7.25 7.25 0 0 0 18.97 14ZM10 21.8A10 10 0 0 1 2.2 14L5.03 14A7.25 7.25 0 0 0 10 18.97ZM2.2 10A10 10 0 0 1 10 2.2L10 5.03A7.25 7.25 0 0 0 5.03 10Z"/><path d="M12 6L18 12L12 18L6 12Z"/></g></g><text x="36.4" y="23" font-size="11.5" font-weight="700" fill="#d8e6e4">Agentic Threat Hunting<tspan dx="8" font-weight="400" fill="#4f6f6e">|</tspan><tspan dx="8" font-weight="400" fill="#b4c6c4">From a ransomware report to one lead</tspan></text></g><path d="M16 34 H624" stroke="#1b3437"/><g class="ag-sw ag-sw0"><g class="ag-s ag-s0"><text x="16" y="194" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#28d7c5" font-size="10.5">1</tspan><tspan dx="7">Purpose-built agents</tspan></text><text x="16" y="213" font-size="10.3" fill="#b4c6c4">A local model does best with one job, so</text><text x="16" y="228.5" font-size="10.3" fill="#b4c6c4">each narrow agent gets only the tools</text><text x="16" y="244" font-size="10.3" fill="#b4c6c4">and context that job needs.</text></g></g><g class="ag-sw ag-sw1"><g class="ag-s ag-s1"><text x="224" y="194" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#28d7c5" font-size="10.5">2</tspan><tspan dx="7">Equipped to adapt</tspan></text><text x="224" y="213" font-size="10.3" fill="#b4c6c4">No results can mean a bad query, not a</text><text x="224" y="228.5" font-size="10.3" fill="#b4c6c4">safe network. So the agent rewrites it,</text><text x="224" y="244" font-size="10.3" fill="#b4c6c4">checks the fix and searches again.</text></g></g><g class="ag-sw ag-sw2"><g class="ag-s ag-s2"><text x="432" y="194" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#ffb869" font-size="10.5">3</tspan><tspan dx="7">Surface to the analyst</tspan></text><text x="432" y="213" font-size="10.3" fill="#b4c6c4">Agents flag what looks suspicious, with</text><text x="432" y="228.5" font-size="10.3" fill="#b4c6c4">the evidence attached. Only a human</text><text x="432" y="244" font-size="10.3" fill="#b4c6c4">analyst makes the call.</text></g></g><g class="ag-stage"><g class="ag-p ag-p0"><g class="ag-team"><path class="ag-wire" d="M138 66 C138 78 56 74 56 90" pathLength="1" stroke="#4f6f6e" fill="none"/><path class="ag-wire" d="M138 66 C138 78 116 74 116 90" pathLength="1" stroke="#4f6f6e" fill="none"/><path class="ag-wire ag-wire-det" d="M138 66 C138 78 176 74 176 90" pathLength="1" stroke="#4f6f6e" fill="none"/><g class="ag-hub"><circle cx="138" cy="58" r="8" fill="#0b1b1e" stroke="#4f6f6e" stroke-width="1.3"/><circle cx="138" cy="58" r="2.6" fill="#4f6f6e"/></g><text x="151" y="61.3" font-size="9.5" fill="#8ba7a6">Supervisor</text><g class="ag-b ag-bh"><rect class="ag-b-glow" x="38" y="86" width="36" height="36" rx="10" fill="none" stroke="#28d7c5" stroke-width="5" stroke-opacity=".22"/><rect x="42" y="90" width="28" height="28" rx="7" fill="#0b1b1e" stroke="#4f6f6e" stroke-width="1.4"/><g class="ag-i" transform="translate(47.6 95.6) scale(1.4)" stroke="#8ba7a6"><path d="M6 1.4a3.6 3.6 0 0 0-2.1 6.5V9.4h4.2V7.9A3.6 3.6 0 0 0 6 1.4z"/><path d="M4.4 11h3.2"/></g><text x="56" y="132" font-size="9.5" fill="#8ba7a6" text-anchor="middle">Hypothesis</text></g><rect class="ag-slot" x="162" y="90" width="28" height="28" rx="7" fill="none" stroke="#4f6f6e" stroke-dasharray="3 3"/></g><g class="ag-rep"><rect x="16" y="49" width="104" height="18" rx="5" fill="#0a191c" stroke="#24464b"/><g class="ag-i" transform="translate(21 51.4) scale(1.1)" stroke="#d8e6e4"><path d="M3 1.6h4l2.2 2.2v6.6H3z"/><path d="M4.6 5.6h3M4.6 7.6h3"/></g><text x="37" y="61.3" font-size="9" fill="#b4c6c4">Ransomware report</text></g><path class="ag-rep-link" d="M120 58 H129" stroke="#4f6f6e" pathLength="1" fill="none"/><g class="ag-repb"><g class="ag-b ag-br"><rect class="ag-b-glow" x="98" y="86" width="36" height="36" rx="10" fill="none" stroke="#28d7c5" stroke-width="5" stroke-opacity=".22"/><rect x="102" y="90" width="28" height="28" rx="7" fill="#0b1b1e" stroke="#4f6f6e" stroke-width="1.4"/><g class="ag-i" transform="translate(107.6 95.6) scale(1.4)" stroke="#8ba7a6"><path d="M2 10.2l.9-2.9L8.4 1.8l2 2-5.5 5.5z"/><path d="M7.3 2.9l2 2"/></g><text x="116" y="132" font-size="9.5" fill="#8ba7a6" text-anchor="middle">Reporting</text></g></g><g class="ag-hunch"><rect x="16" y="146" width="200" height="17" rx="8.5" fill="#0a191c" stroke="#28d7c5" stroke-opacity=".55"/><text x="25" y="158" font-size="10" fill="#b4c6c4"><tspan font-weight="700" fill="#28d7c5">Hunch:</tspan> attackers hide in scheduled tasks</text></g><path class="ag-hpath" d="M56 90 C56 74 138 78 138 66 C138 78 176 74 176 90" pathLength="1" stroke="#28d7c5" stroke-width="3" stroke-linecap="round" fill="none"/></g><g cl