-q"><rect x="238" y="143" width="162" height="16" rx="4" fill="#0a191c" stroke="#24464b"/><g class="ag-q0"><text x="244" y="154.3" font-size="10" font-weight="700" fill="#28d7c5">&#8250;</text><text class="ag-qt" x="253" y="154.3" font-size="9" textLength="129.6" lengthAdjust="spacing"><tspan fill="#b4c6c4">process</tspan><tspan fill="#4f6f6e"> = </tspan><tspan fill="#28d7c5">"schtasks.exe"</tspan></text><path class="ag-qx" d="M252 151.5 H383.6" pathLength="1" stroke="#8ba7a6" stroke-width="1.2"/><rect class="ag-qc" x="252.5" y="144.5" width="131.6" height="13" fill="#0a191c"/><rect class="ag-qk" x="253" y="146" width="1.2" height="10" fill="#28d7c5" style="--w:129.6px"/></g><g class="ag-q1"><text x="244" y="154.3" font-size="10" font-weight="700" fill="#28d7c5">&#8250;</text><text class="ag-qt" x="253" y="154.3" font-size="9" textLength="118.8" lengthAdjust="spacing"><tspan fill="#b4c6c4">event</tspan><tspan fill="#4f6f6e"> = </tspan><tspan fill="#28d7c5">"task created"</tspan></text><g class="ag-qok"><g class="ag-i" transform="translate(383 145) scale(1)" stroke="#28d7c5"><path d="M2.4 6.4l2.4 2.4 4.8-5.2"/></g></g><rect class="ag-qc" x="252.5" y="144.5" width="120.8" height="13" fill="#0a191c"/><rect class="ag-qk" x="253" y="146" width="1.2" height="10" fill="#28d7c5" style="--w:118.8px"/></g></g><text x="238" y="175" font-size="11" fill="#d8e6e4" class="ag-gl ag-gl0" font-weight="600">empty doesn&#39;t mean safe</text><text x="238" y="175" font-size="11" fill="#28d7c5" class="ag-gl ag-gl1" font-weight="600">query checked</text></g><g class="ag-p ag-p2"><g class="ag-card"><rect x="436" y="76" width="92" height="56" rx="6" fill="#0a191c" stroke="#28d7c5" stroke-opacity=".75"/><g class="ag-i" transform="translate(444 85) scale(1.2)" stroke="#28d7c5"><path d="M3 10.6V1.9h6L7.6 4.1 9 6.3H3"/></g><text x="462" y="96" font-size="10.5" font-weight="700" fill="#d8e6e4">1 lead</text><g class="ag-cpen"><g class="ag-i" transform="translate(507 81) scale(1.35)" stroke="#28d7c5"><path d="M2 10.2l.9-2.9L8.4 1.8l2 2-5.5 5.5z"/><path d="M7.3 2.9l2 2"/></g></g><text x="446.5" y="113" font-size="9.8" fill="#b4c6c4">Scheduled Task</text><text x="446.5" y="125" font-size="9" fill="#8ba7a6" letter-spacing=".02em">T1053.005</text></g><g class="ag-trick"><text x="436" y="148" font-size="10.5" fill="#b4c6c4">a known attacker trick</text></g><path class="ag-he" d="M534 104 H566" stroke="#28d7c5" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round" fill="none"/><rect class="ag-pk" x="530" y="100.5" width="9" height="7" rx="1.5" fill="#28d7c5" style="--dx:32px"/><g class="ag-ana"><circle cx="588" cy="104" r="16" fill="#0b1b1e" stroke="#ffb869" stroke-width="1.5"/><g class="ag-i" transform="translate(574.3 90.3) scale(2.28)" stroke="#ffb869"><circle cx="6" cy="4" r="2"/><path d="M2.3 10.6c.6-2 2-3 3.7-3s3.1 1 3.7 3"/></g></g><circle class="ag-halo" cx="588" cy="104" r="16" fill="none" stroke="#ffb869" stroke-width="1.4"/><text x="588" y="138" font-size="9.8" fill="#ffb869" class="ag-decides" text-anchor="middle" font-weight="600">Analyst decides</text></g><path class="ag-ln ag-ln1" d="M191 104 H237" pathLength="1" stroke="#24464b" fill="none"/><path class="ag-ln ag-ln2" d="M393 104 H430" pathLength="1" stroke="#24464b" fill="none"/><path class="ag-wire2" d="M138 66 C138 88 252 64 252 90" pathLength="1" stroke="#4f6f6e" fill="none"/><g class="ag-det" style="--dx:76px"><g class="ag-b ag-bd"><rect class="ag-b-glow" x="158" y="86" width="36" height="36" rx="10" fill="none" stroke="#28d7c5" stroke-width="5" stroke-opacity=".22"/><rect x="162" y="90" width="28" height="28" rx="7" fill="#0b1b1e" stroke="#28d7c5" stroke-width="1.4"/><g class="ag-i" transform="translate(167.6 95.6) scale(1.4)" stroke="#28d7c5"><circle cx="5.2" cy="5.2" r="3.2"/><path d="M7.6 7.6 10.6 10.6"/></g><text x="176" y="132" font-size="9.5" fill="#28d7c5" text-anchor="middle">Detection</text></g></g><g class="ag-fly" style="--dx:93.5px"><g class="ag-fly-y" style="--dy:-18.5