<text x="16" y="197" font-size="10.3" font-weight="400" fill="#b4c6c4">A supervisor splits the hunt among</text><text x="16" y="212.5" font-size="10.3" font-weight="400" fill="#b4c6c4">narrow agents, each given only the tools</text><text x="16" y="228" font-size="10.3" font-weight="400" fill="#b4c6c4">and context its one job needs.</text></g><path class="ag-chev ag-chev0" d="M200 95 l4 5 -4 5" stroke="#8ba7a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g class="ag-s ag-s1"><g class="ag-p ag-p1"><circle class="ag-rip ag-rip0" cx="252" cy="100" r="13" stroke="#28d7c5" stroke-width="1.4"/><circle class="ag-rip ag-rip1" cx="252" cy="100" r="13" stroke="#28d7c5" stroke-width="1.4"/><circle class="ag-rip ag-rip2" cx="252" cy="100" r="13" stroke="#28d7c5" stroke-width="1.4"/><circle class="ag-rip ag-rip3" cx="252" cy="100" r="13" stroke="#28d7c5" stroke-width="1.4"/><circle class="ag-fl ag-fl-arr" cx="252" cy="100" r="17" fill="#28d7c5" fill-opacity=".22" stroke="#28d7c5" stroke-width="1.6"/><circle class=" ag-nd" cx="252" cy="100" r="13" fill="#28d7c5" stroke="#28d7c5"/><path class="ag-loop" d="M263.5 80 A23 23 0 1 1 230.2 93.1" pathLength="1" stroke="#28d7c5" stroke-width="1.5"/><path class="ag-lh" d="M230.2 93.1 L232.3 101.1 L223.8 98.4 Z" fill="#28d7c5" stroke="#28d7c5" stroke-width="1" stroke-linejoin="round"/><g class="ag-tool ag-tool0"><path d="M277 100 C281 100 281 76 287 76" stroke="#24464b"/><rect x="287" y="67" width="102" height="18" rx="4" fill="#0a191c" stroke="#24464b"/><path class="ag-fl ag-gw ag-g0a" d="M277 100 C281 100 281 76 287 76" stroke="#28d7c5" stroke-width="1.4"/><rect class="ag-fl ag-g0a" x="287" y="67" width="102" height="18" rx="4" fill="#28d7c5" fill-opacity=".12" stroke="#28d7c5"/><path class="ag-fl ag-gw ag-g0b" d="M277 100 C281 100 281 76 287 76" stroke="#28d7c5" stroke-width="1.4"/><rect class="ag-fl ag-g0b" x="287" y="67" width="102" height="18" rx="4" fill="#28d7c5" fill-opacity=".12" stroke="#28d7c5"/><g class="