<svg class="ag-scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="An illustrative hunt. From a ransomware report, AI agents search for a scheduled-task persistence technique; the first search, for schtasks.exe, comes back empty. Empty is not the same as clear: tasks made through the Task Scheduler API never launch schtasks.exe, so the Detection agent re-plans around event 4698, a task being created. That finds one unusual task, \WinTaskUpdate, on one host and not in the baseline, and a human analyst makes the call."><rect x=".5" y=".5" width="639" height="249" rx="12" fill="#061214" stroke="#24464b"/><g class="ag-head"><g class="ag-i" transform="translate(16 13) scale(1.05)" stroke="#7f9b9a"><path d="M3 1.6h4l2.2 2.2v6.6H3z"/><path d="M4.6 5.6h3M4.6 7.6h3"/></g><text x="32" y="23" font-size="11.5" font-weight="700" fill="#d8e6e4">Ransomware report</text><text x="624" y="23" text-anchor="end" font-size="9.5" fill="#7f9b9a">T1053.005 · Scheduled Task</text></g><path d="M16 34 H624" stroke="#1b3437"/><g class="ag-s ag-s0"><g class="ag-p ag-p0"><path d="M58.7 80.6 C58.7 88.6 29 88 29 96" stroke="#4f6f6e"/><path d="M58.7 80.6 C58.7 88.6 58.7 88 58.7 96" stroke="#4f6f6e"/><path d="M58.7 80.6 C58.7 88.6 88.4 88 88.4 96" stroke="#4f6f6e"/><path class="ag-c ag-c1" d="M58.7 80.6 C58.7 88.6 88.4 88 88.4 96" pathLength="1" stroke="#28d7c5"/><circle cx="58.7" cy="69.6" r="11" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="58.7" cy="69.6" r="3.3" fill="#4f6f6e"/><circle cx="29" cy="107" r="11" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="29" cy="107" r="3.3" fill="#4f6f6e"/><circle cx="58.7" cy="107" r="11" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="58.7" cy="107" r="3.3" fill="#4f6f6e"/><g class="ag-det"><circle class="ag-nd" cx="88.4" cy="107" r="11" fill="#28d7c5" stroke="#28d7c5"/><circle class="ag-ndd" cx="88.4" cy="107" r="3.3" fill="#061214"/></g></g><text class="ag-t" x="16" y="146" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#7f9b9a" font-size="10.5">1</tspan><tspan dx="7">Search</tspan></text><text x="16" y="165" font-size="10.8" font-weight="400" fill="#a9bcba">AI agents turn the report into searches.</text><text x="16" y="180.5" font-size="10.8" font-weight="400" fill="#a9bcba">The first comes back empty.</text><text class="ag-ev ag-ev0 ag-m" x="16" y="216.5" font-size="9" fill="#7f9b9a">process = schtasks.exe</text><text class="ag-evr ag-evr0" x="16" y="229.1" font-size="9" font-weight="600" fill="#d8e6e4">0 results</text></g><path class="ag-chev" d="M201 96 l4 5 -4 5" stroke="#4f6f6e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><g class="ag-s ag-s1"><g class="ag-p ag-p1"><g class=""><circle class="ag-nd" cx="249.8" cy="104.2" r="13.8" fill="#28d7c5" stroke="#28d7c5"/><circle class="ag-ndd" cx="249.8" cy="104.2" r="4.1" fill="#061214"/></g><path class="ag-loop" d="M260.7 85.2 A21.8 21.8 0 1 1 229.1 97.7" pathLength="1" stroke="#28d7c5" stroke-width="1.6"/><path class="ag-lh" d="M224.1 92.2 L229.1 97.7 L235.1 94.7" stroke="#28d7c5" stroke-width="1.6"/></g><text class="ag-t" x="224" y="146" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#28d7c5" font-size="10.5">2</tspan><tspan dx="7">Re-plan</tspan></text><text x="224" y="165" font-size="10.8" font-weight="400" fill="#a9bcba">Empty doesn&#39;t mean safe. The agent</text><text x="224" y="180.5" font-size="10.8" font-weight="400" fill="#a9bcba">checks whether its search could even</text><text x="224" y="196" font-size="10.8" font-weight="400" fill="#a9bcba">see the threat, then tries another way.</text><text class="ag-ev ag-ev1 ag-m" x="224" y="216.5" font-size="9" fill="#7f9b9a">event 4698</text><text class="ag-evr ag-evr1" x="224" y="229.1" font-size="9" font-weight="400" fill="#7f9b9a">a task being created</text></g><path class="ag-chev" d="M409 96 l4 5 -4 5" stroke="#4f6f6e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><g class="ag-s ag-s2"><g class="ag-p ag-p2"><g class="ag-flag" stroke-width="0.6"><g class="ag-i" transform="translate(436 89.9) scale(2.3)" stroke="#28d7c5"><path d="M3 10.6V1.9h6L7.6 4.1 9 6.3H3"/></g></g><path class="ag-he" d="M463.9 104.2 H488.09999999999997" stroke="#28d7c5" stroke-width="1.3" stroke-dasharray="4 3" stroke-linecap="round"/><g class="ag-ana"><circle cx="505.9" cy="104.2" r="13.8" fill="#0b1b1e" stroke="#ffb869" stroke-width="1.3"/><g class="ag-i" transform="translate(494.1 92.4) scale(2)" stroke="#ffb869"><circle cx="6" cy="4" r="2"/><path d="M2.3 10.6c.6-2 2-3 3.7-3s3.1 1 3.7 3"/></g></g></g><text class="ag-t" x="432" y="146" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#ffb869" font-size="10.5">3</tspan><tspan dx="7">Hand off</tspan></text><text x="432" y="165" font-size="10.8" font-weight="400" fill="#a9bcba">One unusual task on one computer.</text><text x="432" y="180.5" font-size="10.8" font-weight="400" fill="#a9bcba">A human analyst makes the call.</text><text class="ag-ev ag-ev2 ag-m" x="432" y="216.5" font-size="9" fill="#7f9b9a">\WinTaskUpdate</text><text class="ag-evr ag-evr2" x="432" y="229.1" font-size="9" font-weight="400" fill="#7f9b9a">1 host · not in baseline</text></g></svg>