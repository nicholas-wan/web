xt><text x="224" y="197" font-size="10.3" font-weight="400" fill="#b4c6c4">The first search comes back empty, but</text><text x="224" y="212.5" font-size="10.3" font-weight="400" fill="#b4c6c4">empty doesn&#39;t mean safe. The agent asks</text><text x="224" y="228" font-size="10.3" font-weight="400" fill="#b4c6c4">what it missed and searches another way.</text></g><path class="ag-chev ag-chev1" d="M408 95 l4 5 -4 5" stroke="#8ba7a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g class="ag-s ag-s2"><g class="ag-p ag-p2"><g class="ag-flag"><rect class="ag-cardf" x="432.5" y="72" width="96" height="56" rx="5" fill="#0a191c"/><rect class="ag-cardo" x="432.5" y="72" width="96" height="56" rx="5" pathLength="1" stroke="#28d7c5" stroke-opacity=".7"/><g class="ag-lead"><g class="ag-i" transform="translate(440.5 79) scale(1.4)" stroke="#28d7c5"><path d="M3 10.6V1.9h6L7.6 4.1 9 6.3H3"/></g><text x="460.5" y="91" font-size="10" font-weight="700" fill="#d8e6e4">1 lead</text></g><path class="ag-ln ag-ln0" d="M444.5 104 H509.5" pathLength="1" stroke="#4f6f6e" stroke-width="2" stroke-linecap="round"/><path class="ag-ln ag-ln1" d="M444.5 111 H491.5" pathLength="1" stroke="#4f6f6e" stroke-width="2" stroke-linecap="round"/><path class="ag-ln ag-ln2" d="M444.5 118 H501.5" pathLength="1" stroke="#4f6f6e" stroke-width="2" stroke-linecap="round"/></g><path class="ag-he" d="M534.5 100 H566.5" stroke="#28d7c5" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><circle class="ag-pk" cx="534.5" cy="100" r="3" fill="#28d7c5" style="--dx:32px"/><g class="ag-ana"><circle cx="589.3" cy="100" r="16.3" fill="#0b1b1e" stroke="#ffb869" stroke-width="1.5"/><g class="ag-i" transform="translate(575.3 86) scale(2.3)" stroke="#ffb869"><circle cx="6" cy="4" r="2"/><path d="M2.3 10.6c.6-2 2-3 3.7-3s3.1 1 3.7 3"/></g></g><circle class="ag-rip ag-halo" cx="589.3" cy="100" r="16.3" stroke="#ffb869" stroke-width="1.4"/></g><text class="ag-t" x="432" y="178" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#ffb869" font-size="10.5">3</tspan><tspan dx="7">Surface to the analyst</tspan></text><text x="432" y="197" font-size="10.3" font-weight="400" fill="#b4c6c4">Agents surface what looks suspicious,</text><text x="432" y="212.5" font-size="10.3" font-weight="400" fill="#b4c6c4">evidence attached. Only a human analyst</text><text x="432" y="228" font-size="10.3" font-weight="400" fill="#b4c6c4">makes the call.</text></g></svg>