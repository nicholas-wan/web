<svg class="ag-scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 274" role="img" aria-label="An illustrative hunt. From a ransomware report, a supervisor agent splits the hunt among narrow agents, each built for one job: a hypothesis, past hunts, search. The first search, for schtasks.exe, comes back empty. Agents carry tools and skills, and empty does not mean safe: tasks made through the Task Scheduler API never launch schtasks.exe, so the searching agent asks whether its search could have missed the threat and searches another way, around event 4698, a task being created. That surfaces one unusual task, \WinTaskUpdate, on one host and not in the baseline, with the evidence attached, and a human analyst makes the call."><rect x=".5" y=".5" width="639" height="273" rx="12" fill="#061214" stroke="#24464b"/><g class="ag-head"><g class="ag-i" transform="translate(16 13) scale(1.05)" stroke="#8ba7a6"><path d="M3 1.6h4l2.2 2.2v6.6H3z"/><path d="M4.6 5.6h3M4.6 7.6h3"/></g><text x="32" y="23" font-size="11.5" font-weight="700" fill="#d8e6e4">How one hunt ran</text><text x="624" y="23" text-anchor="end" font-size="9.5" fill="#8ba7a6">Ransomware report · T1053.005 Scheduled Task</text></g><path d="M16 34 H624" stroke="#1b3437"/><g class="ag-s ag-s0"><g class="ag-p ag-p0"><path d="M92 80 C92 88 40 86 40 94" stroke="#4f6f6e"/><path d="M92 80 C92 88 92 86 92 94" stroke="#4f6f6e"/><path d="M92 80 C92 88 144 86 144 94" stroke="#4f6f6e"/><path class="ag-c ag-c1" d="M92 80 C92 88 144 86 144 94" pathLength="1" stroke="#28d7c5"/><circle cx="92" cy="70" r="10" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="92" cy="70" r="3" fill="#4f6f6e"/><circle cx="40" cy="104" r="10" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="40" cy="104" r="3" fill="#4f6f6e"/><circle cx="92" cy="104" r="10" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="92" cy="104" r="3" fill="#4f6f6e"/><circle class="ag-det ag-nd" cx="144" cy="104" r="10" fill="#28d7c5" stroke="#28d7c5"/><text x="92" y="55" text-anchor="middle" font-size="8.5" fill="#8ba7a6">Supervisor</text><g class=""><text x="40" y="125.5" text-anchor="middle" font-size="8.5" fill="#8ba7a6">Hypothesis</text></g><g class=""><text x="92" y="125.5" text-anchor="middle" font-size="8.5" fill="#8ba7a6">Past hunts</text></g><g class="ag-job-on"><text x="144" y="125.5" text-anchor="middle" font-size="8.5" fill="#28d7c5">Search</text></g></g><text class="ag-t" x="16" y="156" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#28d7c5" font-size="10.5">1</tspan><tspan dx="7">Purpose-built agents</tspan></text><text x="16" y="175" font-size="10.3" font-weight="400" fill="#b4c6c4">A supervisor splits the hunt among</text><text x="16" y="190.5" font-size="10.3" font-weight="400" fill="#b4c6c4">narrow agents, each built for one job.</text><text x="16" y="206" font-size="10.3" font-weight="400" fill="#b4c6c4">The first search comes back empty.</text><text class="ag-ev ag-ev0" x="16" y="226.5" font-size="7.2" font-weight="700" letter-spacing=".08em" fill="#4f6f6e">EVIDENCE</text><text class="ag-ev ag-ev0 ag-m" x="16" y="238.7" font-size="9" fill="#8ba7a6">process = schtasks.exe</text><text class="ag-evr ag-evr0" x="16" y="251.3" font-size="9" font-weight="600" fill="#d8e6e4">0 results</text></g><path class="ag-chev" d="M207 83 l4 5 -4 5" stroke="#8ba7a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g class="ag-s ag-s1"><g class="ag-p ag-p1"><circle class=" ag-nd" cx="249" cy="88" r="10" fill="#28d7c5" stroke="#28d7c5"/><path class="ag-loop" d="M259 70.6 A20 20 0 1 1 230 82" pathLength="1" stroke="#28d7c5" stroke-width="1.6"/><path class="ag-lh" d="M225 76 L231 83 L236.5 78.5 Z" fill="#28d7c5" stroke="#28d7c5" stroke-width="1"/><g class="ag-tool ag-tool0"><path d="M259 88 C268 88 272 68 281 68" stroke="#1b3437"/><rect x="281" y="60.5" width="70" height="15" rx="4" fill="#0a191c" stroke="#1b3437"/><g class="ag-i" transform="translate(286 62) scale(1)" stroke="#28d7c5"><circle cx="5.2" cy="5.2" r="3.2"/><path d="M7.6 7.6 10.6 10.6"/></g><text x="301" y="71" font-size="8.5" fill="#b4c6c4">search</text></g><g class="ag-tool ag-tool1"><path d="M259 88 C268 88 272 88 281 88" stroke="#1b3437"/><rect x="281" y="80.5" width="70" height="15" rx="4" fill="#0a191c" stroke="#1b3437"/><g class="ag-i" transform="translate(286 82) scale(1)" stroke="#28d7c5"><path d="M2.4 6.4l2.4 2.4 4.8-5.2"/></g><text x="301" y="91" font-size="8.5" fill="#b4c6c4">check query</text></g><g class="ag-tool ag-tool2"><path d="M259 88 C268 88 272 108 281 108" stroke="#1b3437"/><rect x="281" y="100.5" width="70" height="15" rx="4" fill="#0a191c" stroke="#1b3437"/><g class="ag-i" transform="translate(286 102) scale(1)" stroke="#28d7c5"><circle cx="6" cy="6" r="4.2"/><path d="M6 3.6V6l1.8 1.2"/></g><text x="301" y="111" font-size="8.5" fill="#b4c6c4">past hunts</text></g></g><text class="ag-t" x="224" y="156" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#28d7c5" font-size="10.5">2</tspan><tspan dx="7">Tools to adapt on evidence</tspan></text><text x="224" y="175" font-size="10.3" font-weight="400" fill="#b4c6c4">Empty doesn&#39;t mean safe, so the agent</text><text x="224" y="190.5" font-size="10.3" font-weight="400" fill="#b4c6c4">asks whether its search could have</text><text x="224" y="206" font-size="10.3" font-weight="400" fill="#b4c6c4">missed it, and searches another way.</text><text class="ag-ev ag-ev1" x="224" y="226.5" font-size="7.2" font-weight="700" letter-spacing=".08em" fill="#4f6f6e">EVIDENCE</text><text class="ag-ev ag-ev1 ag-m" x="224" y="238.7" font-size="9" fill="#8ba7a6">event 4698</text><text class="ag-evr ag-evr1" x="224" y="251.3" font-size="9" font-weight="600" fill="#d8e6e4">a task being created</text></g><path class="ag-chev" d="M415 83 l4 5 -4 5" stroke="#8ba7a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g class="ag-s ag-s2"><g class="ag-p ag-p2"><g class="ag-flag"><rect x="436" y="65" width="78" height="46" rx="5" fill="#0a191c" stroke="#28d7c5" stroke-opacity=".7"/><g class="ag-i" transform="translate(442 70) scale(1.2)" stroke="#28d7c5"><path d="M3 10.6V1.9h6L7.6 4.1 9 6.3H3"/></g><text x="459" y="80.5" font-size="8.5" font-weight="700" fill="#d8e6e4">1 lead</text><path d="M443 91 H496M443 97 H482M443 103 H490" stroke="#4f6f6e" stroke-width="1.8" stroke-linecap="round"/></g><path class="ag-he" d="M520 88 H550" stroke="#28d7c5" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><g class="ag-ana"><circle cx="567.5" cy="88" r="12.5" fill="#0b1b1e" stroke="#ffb869" stroke-width="1.3"/><g class="ag-i" transform="translate(556.8 77.3) scale(1.8)" stroke="#ffb869"><circle cx="6" cy="4" r="2"/><path d="M2.3 10.6c.6-2 2-3 3.7-3s3.1 1 3.7 3"/></g></g></g><text class="ag-t" x="432" y="156" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#ffb869" font-size="10.5">3</tspan><tspan dx="7">Surface to the analyst</tspan></text><text x="432" y="175" font-size="10.3" font-weight="400" fill="#b4c6c4">Agents surface what looks suspicious,</text><text x="432" y="190.5" font-size="10.3" font-weight="400" fill="#b4c6c4">evidence attached. A human analyst</text><text x="432" y="206" font-size="10.3" font-weight="400" fill="#b4c6c4">makes the call.</text><text class="ag-ev ag-ev2" x="432" y="226.5" font-size="7.2" font-weight="700" letter-spacing=".08em" fill="#4f6f6e">EVIDENCE</text><text class="ag-ev ag-ev2 ag-m" x="432" y="238.7" font-size="9" fill="#8ba7a6">\WinTaskUpdate</text><text class="ag-evr ag-evr2" x="432" y="251.3" font-size="9" font-weight="600" fill="#d8e6e4">1 host · not in baseline</text></g></svg>