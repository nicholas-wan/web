<svg class="ag-scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" role="img" aria-label="An illustrative hunt. From a ransomware report, a supervisor agent splits the hunt among narrow agents, each given only the tools and context its one job needs: forming a hypothesis, writing and running the detection logic, reporting. Agents carry tools and skills. The Detection agent&#39;s first search, for schtasks.exe, comes back empty, and empty does not mean safe: tasks made through the Task Scheduler API never launch schtasks.exe, so the agent asks whether its search could have missed the threat, checks a new query and searches another way, around event 4698, a task being created. That surfaces one unusual task, \WinTaskUpdate, on one host and not in the baseline. The Report agent writes it up with the evidence attached, and only a human analyst makes the call."><rect x=".5" y=".5" width="639" height="245" rx="12" fill="#061214" stroke="#24464b"/><g class="ag-head"><g class="ag-i" transform="translate(16 13) scale(1.05)" stroke="#8ba7a6"><path d="M3 1.6h4l2.2 2.2v6.6H3z"/><path d="M4.6 5.6h3M4.6 7.6h3"/></g><text x="32" y="23" font-size="11.5" font-weight="700" fill="#d8e6e4">From a ransomware report to one lead</text><text x="624" y="23" text-anchor="end" font-size="9.5" fill="#8ba7a6">T1053.005 · Scheduled Task</text></g><path d="M16 34 H624" stroke="#1b3437"/><g class="ag-s ag-s0"><g class="ag-p ag-p0"><path d="M100 90.8 C100 98.8 40 101 40 109" stroke="#4f6f6e"/><path d="M100 90.8 C100 98.8 100 101 100 109" stroke="#4f6f6e"/><path d="M100 90.8 C100 98.8 160 101 160 109" stroke="#4f6f6e"/><path class="ag-c ag-c0" d="M100 90.8 C100 98.8 40 101 40 109" pathLength="1" stroke="#28d7c5"/><path class="ag-c ag-c0r" d="M100 90.8 C100 98.8 40 101 40 109" pathLength="1" stroke="#28d7c5"/><path class="ag-c ag-c1" d="M100 90.8 C100 98.8 100 101 100 109" pathLength="1" stroke="#28d7c5"/><path class="ag-c ag-c2" d="M100 90.8 C100 98.8 160 101 160 109" pathLength="1" stro