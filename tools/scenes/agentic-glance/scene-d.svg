<svg class="ag-scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" role="img" aria-label="An illustrative hunt. From a ransomware report, a supervisor agent splits the hunt among narrow agents, each built for one job: forming a hypothesis, writing and running the detection logic, reporting. The first search, for schtasks.exe, comes back empty. Agents carry tools and skills, and empty does not mean safe: tasks made through the Task Scheduler API never launch schtasks.exe, so the Detection agent asks whether its search could have missed the threat and searches another way, around event 4698, a task being created. That surfaces one unusual task, \WinTaskUpdate, on one host and not in the baseline, with the evidence attached, and a human analyst makes the call."><rect x=".5" y=".5" width="639" height="295" rx="12" fill="#061214" stroke="#24464b"/><g class="ag-head"><g class="ag-i" transform="translate(16 13) scale(1.05)" stroke="#8ba7a6"><path d="M3 1.6h4l2.2 2.2v6.6H3z"/><path d="M4.6 5.6h3M4.6 7.6h3"/></g><text x="32" y="23" font-size="11.5" font-weight="700" fill="#d8e6e4">How one hunt ran</text><text x="624" y="23" text-anchor="end" font-size="9.5" fill="#8ba7a6">Ransomware report · T1053.005 Scheduled Task</text></g><path d="M16 34 H624" stroke="#1b3437"/><g class="ag-s ag-s0"><g class="ag-p ag-p0"><path d="M104 90.8 C104 98.8 44 101 44 109" stroke="#4f6f6e"/><path d="M104 90.8 C104 98.8 104 101 104 109" stroke="#4f6f6e"/><path d="M104 90.8 C104 98.8 164 101 164 109" stroke="#4f6f6e"/><path class="ag-c ag-c1" d="M104 90.8 C104 98.8 104 101 104 109" pathLength="1" stroke="#28d7c5"/><circle cx="104" cy="77.8" r="13" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="104" cy="77.8" r="3.9" fill="#4f6f6e"/><circle cx="44" cy="122" r="13" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="44" cy="122" r="3.9" fill="#4f6f6e"/><circle class="ag-det ag-nd" cx="104" cy="122" r="13" fill="#28d7c5" stroke="#28d7c5"/><circle cx="164" cy="122" r="13" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="164" cy="122" r="3.9" fill="#4f6f6e"/><text x="104" y="59.8" text-anchor="middle" font-size="9.5" fill="#8ba7a6">Supervisor</text><g class=""><text x="44" y="147.5" text-anchor="middle" font-size="9.5" fill="#8ba7a6">Hypothesis</text></g><g class="ag-job-on"><text x="104" y="147.5" text-anchor="middle" font-size="9.5" fill="#28d7c5">Detection</text></g><g class=""><text x="164" y="147.5" text-anchor="middle" font-size="9.5" fill="#8ba7a6">Report</text></g></g><text class="ag-t" x="16" y="178" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#28d7c5" font-size="10.5">1</tspan><tspan dx="7">Purpose-built agents</tspan></text><text x="16" y="197" font-size="10.3" font-weight="400" fill="#b4c6c4">A supervisor splits the hunt among</text><text x="16" y="212.5" font-size="10.3" font-weight="400" fill="#b4c6c4">narrow agents, each built for one job.</text><text x="16" y="228" font-size="10.3" font-weight="400" fill="#b4c6c4">The first search comes back empty.</text><text class="ag-ev ag-ev0" x="16" y="248.5" font-size="7.2" font-weight="700" letter-spacing=".08em" fill="#4f6f6e">EVIDENCE</text><text class="ag-ev ag-ev0 ag-m" x="16" y="260.6" font-size="9" fill="#8ba7a6">process = schtasks.exe</text><text class="ag-evr ag-evr0" x="16" y="273.3" font-size="9" font-weight="600" fill="#d8e6e4">0 results</text></g><path class="ag-chev" d="M207 95 l4 5 -4 5" stroke="#8ba7a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g class="ag-s ag-s1"><g class="ag-p ag-p1"><circle class=" ag-nd" cx="252" cy="100" r="13" fill="#28d7c5" stroke="#28d7c5"/><path class="ag-loop" d="M263.5 80 A23 23 0 1 1 230.2 93.1" pathLength="1" stroke="#28d7c5" stroke-width="1.6"/><path class="ag-lh" d="M225.2 87.1 L231.2 94.1 L236.7 89.6 Z" fill="#28d7c5" stroke="#28d7c5" stroke-width="1"/><g class="ag-tool ag-tool0"><path d="M265 100 C274 100 278 76 287 76" stroke="#1b3437"/><rect x="287" y="67" width="84" height="18" rx="4" fill="#0a191c" stroke="#1b3437"/><g class="ag-i" transform="translate(293 70) scale(1)" stroke="#28d7c5"><circle cx="5.2" cy="5.2" r="3.2"/><path d="M7.6 7.6 10.6 10.6"/></g><text x="309" y="79.5" font-size="10" fill="#b4c6c4">search</text></g><g class="ag-tool ag-tool1"><path d="M265 100 C274 100 278 100 287 100" stroke="#1b3437"/><rect x="287" y="91" width="84" height="18" rx="4" fill="#0a191c" stroke="#1b3437"/><g class="ag-i" transform="translate(293 94) scale(1)" stroke="#28d7c5"><path d="M2.4 6.4l2.4 2.4 4.8-5.2"/></g><text x="309" y="103.5" font-size="10" fill="#b4c6c4">check query</text></g><g class="ag-tool ag-tool2"><path d="M265 100 C274 100 278 124 287 124" stroke="#1b3437"/><rect x="287" y="115" width="84" height="18" rx="4" fill="#0a191c" stroke="#1b3437"/><g class="ag-i" transform="translate(293 118) scale(1)" stroke="#28d7c5"><circle cx="6" cy="6" r="4.2"/><path d="M6 3.6V6l1.8 1.2"/></g><text x="309" y="127.5" font-size="10" fill="#b4c6c4">analyse results</text></g></g><text class="ag-t" x="224" y="178" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#28d7c5" font-size="10.5">2</tspan><tspan dx="7">Tools to adapt on evidence</tspan></text><text x="224" y="197" font-size="10.3" font-weight="400" fill="#b4c6c4">Empty doesn&#39;t mean safe, so the agent</text><text x="224" y="212.5" font-size="10.3" font-weight="400" fill="#b4c6c4">asks whether its search could have</text><text x="224" y="228" font-size="10.3" font-weight="400" fill="#b4c6c4">missed it, and searches another way.</text><text class="ag-ev ag-ev1" x="224" y="248.5" font-size="7.2" font-weight="700" letter-spacing=".08em" fill="#4f6f6e">EVIDENCE</text><text class="ag-ev ag-ev1 ag-m" x="224" y="260.6" font-size="9" fill="#8ba7a6">event 4698</text><text class="ag-evr ag-evr1" x="224" y="273.3" font-size="9" font-weight="600" fill="#d8e6e4">a task being created</text></g><path class="ag-chev" d="M415 95 l4 5 -4 5" stroke="#8ba7a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g class="ag-s ag-s2"><g class="ag-p ag-p2"><g class="ag-flag"><rect x="436" y="72" width="96" height="56" rx="5" fill="#0a191c" stroke="#28d7c5" stroke-opacity=".7"/><g class="ag-i" transform="translate(444 79) scale(1.4)" stroke="#28d7c5"><path d="M3 10.6V1.9h6L7.6 4.1 9 6.3H3"/></g><text x="464" y="91" font-size="10" font-weight="700" fill="#d8e6e4">1 lead</text><path d="M445 104 H510M445 111 H492M445 118 H502" stroke="#4f6f6e" stroke-width="2" stroke-linecap="round"/></g><path class="ag-he" d="M538 100 H568" stroke="#28d7c5" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><g class="ag-ana"><circle cx="589.3" cy="100" r="16.3" fill="#0b1b1e" stroke="#ffb869" stroke-width="1.3"/><g class="ag-i" transform="translate(575.3 86) scale(2.3)" stroke="#ffb869"><circle cx="6" cy="4" r="2"/><path d="M2.3 10.6c.6-2 2-3 3.7-3s3.1 1 3.7 3"/></g></g></g><text class="ag-t" x="432" y="178" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#ffb869" font-size="10.5">3</tspan><tspan dx="7">Surface to the analyst</tspan></text><text x="432" y="197" font-size="10.3" font-weight="400" fill="#b4c6c4">Agents surface what looks suspicious,</text><text x="432" y="212.5" font-size="10.3" font-weight="400" fill="#b4c6c4">evidence attached. A human analyst</text><text x="432" y="228" font-size="10.3" font-weight="400" fill="#b4c6c4">makes the call.</text><text class="ag-ev ag-ev2" x="432" y="248.5" font-size="7.2" font-weight="700" letter-spacing=".08em" fill="#4f6f6e">EVIDENCE</text><text class="ag-ev ag-ev2 ag-m" x="432" y="260.6" font-size="9" fill="#8ba7a6">\WinTaskUpdate</text><text class="ag-evr ag-evr2" x="432" y="273.3" font-size="9" font-weight="600" fill="#d8e6e4">1 host · not in baseline</text></g></svg>