"120.8" height="11" fill="#0a191c"/><rect class="ag-qk" x="244" y="142" width="1.2" height="8" fill="#28d7c5" style="--w:118.8px"/></g><g class="ag-qd"><circle cx="237" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="243.4" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="249.8" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="256.2" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="262.6" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="269" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="275.4" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="281.8" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="288.2" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="294.6" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="301" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="307.4" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="313.8" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="320.2" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="326.6" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="333" cy="143.5" r="1.6" fill="#4f6f6e"/><circle cx="237" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="243.4" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="249.8" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="256.2" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="262.6" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="269" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="275.4" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="281.8" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="288.2" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="294.6" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="307.4" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="313.8" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="320.2" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="326.6" cy="148.5" r="1.6" fill="#4f6f6e"/><circle cx="333" cy="148.5" r="1.6" fill="#4f6f6e"/><rect class="ag-qs" x="234" y="141" width="2" height="10" rx="1" fill="#28d7c5" style="--w:102px"/><circle cx="301" cy="148.5" r="1.6" fill="#4f6f6e"/><circle class="ag-rip ag-qr" cx="301" cy="148.5" r="3" stroke="#28d7c5" stroke-width="1.4"/><circle class="ag-qo" cx="301" cy="148.5" r="2.4" fill="#28d7c5"/><text class="ag-qw" x="342" y="148.9" font-size="9" font-weight="600" fill="#28d7c5">1 unusual</text></g></g></g><text class="ag-t" x="224" y="178" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#28d7c5" font-size="10.5">2</tspan><tspan dx="7">Equipped to adapt</tspan></text><text x="224" y="197" font-size="10.3" font-weight="400" fill="#b4c6c4">No results can mean a bad query, not a</text><text x="224" y="212.5" font-size="10.3" font-weight="400" fill="#b4c6c4">safe network. So the agent rewrites it,</text><text x="224" y="228" font-size="10.3" font-weight="400" fill="#b4c6c4">checks the fix and searches again.</text></g><path class="ag-chev ag-chev1" d="M408 95 l4 5 -4 5" stroke="#8ba7a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g class="ag-s ag-s2"><g class="ag-p ag-p2"><g class="ag-flag"><rect class="ag-cardf" x="432.5" y="71.5" width="90" height="57" rx="5" fill="#0a191c"/><rect class="ag-cardo" x="432.5" y="71.5" width="90" height="57" rx="5" pathLength="1" stroke="#28d7c5" stroke-opacity=".7"/><g class="ag-lead"><g class="ag-i" transform="translate(439.5 79.5) scale(1.2)" stroke="#28d7c5"><path d="M3 10.6V1.9h6L7.6 4.1 9 6.3H3"/></g><text x="457.5" y="90.5" font-size="10.5" font-weight="700" fill="#d8e6e4">1 lead</text></g><text class="ag-ln0" x="443" y="105.5" font-size="9.5" fill="#b4c6c4">Scheduled Task</text><text class="ag-ln1" x="443" y="117.5" font-size="9" letter-spacing=".02em" fill="#8ba7a6">T1053.005</text></g><path class="ag-he" d="M528.5 100 H581.5" stroke="#28d7c5" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><circle class="ag-pk" cx="528.5" cy="100" r="3" fill="#28d7c5" style="--dx:53px"/><g class="ag-ana"><circle cx="604.3" cy="100" r="16.3" fill="#0b1b1e" stroke="#ffb869" stroke-width="1.5"/><g class="ag-i" transform="translate(590.3 86) scale(2.3)" stroke="#ffb869"><circle cx="6" cy="4" r="2"/><path d="M2.3 10.6c.6-2 2-3 3.7-3s3.1 1 3.7 3"/></g></g><circle class="ag-rip ag-halo" cx="604.3" cy="100" r="16.3" stroke="#ffb869" stroke-width="1.4"/></g><text class="ag-t" x="432" y="178" font-size="12.5" font-weight="700" fill="#d8e6e4"><tspan fill="#ffb869" font-size="10.5">3</tspan><tspan dx="7">Surface to the analyst</tspan></text><text x="432" y="197" font-size="10.3" font-weight="400" fill="#b4c6c4">Agents flag what looks suspicious, with</text><text x="432" y="212.5" font-size="10.3" font-weight="400" fill="#b4c6c4">the evidence attached. Only a human</text><text x="432" y="228" font-size="10.3" font-weight="400" fill="#b4c6c4">analyst makes the call.</text></g></svg>