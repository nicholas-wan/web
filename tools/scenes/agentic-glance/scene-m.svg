<svg class="ag-scene ag-scene--m" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-label="An illustrative hunt. From a ransomware report, a supervisor agent splits the hunt among narrow agents, each built for one job: a hypothesis, past hunts, search. The first search, for schtasks.exe, comes back empty. Agents carry tools and skills, and empty does not mean safe: tasks made through the Task Scheduler API never launch schtasks.exe, so the searching agent asks whether its search could have missed the threat and searches another way, around event 4698, a task being created. That surfaces one unusual task, \WinTaskUpdate, on one host and not in the baseline, with the evidence attached, and a human analyst makes the call."><rect x=".5" y=".5" width="359" height="469" rx="12" fill="#061214" stroke="#24464b"/><g class="ag-head"><g class="ag-i" transform="translate(16 11) scale(1.05)" stroke="#8ba7a6"><path d="M3 1.6h4l2.2 2.2v6.6H3z"/><path d="M4.6 5.6h3M4.6 7.6h3"/></g><text x="32" y="21" font-size="13" font-weight="700" fill="#d8e6e4">How one hunt ran</text><text x="344" y="21" text-anchor="end" font-size="11" fill="#8ba7a6">Ransomware report · T1053.005</text></g><path d="M16 32 H344" stroke="#1b3437"/><g class="ag-s ag-s0"><g class="ag-p ag-p0"><path d="M50.6 102.7 C50.6 110.7 29 107.3 29 115.3" stroke="#4f6f6e"/><path d="M50.6 102.7 C50.6 110.7 50.6 107.3 50.6 115.3" stroke="#4f6f6e"/><path d="M50.6 102.7 C50.6 110.7 72.2 107.3 72.2 115.3" stroke="#4f6f6e"/><path class="ag-c ag-c1" d="M50.6 102.7 C50.6 110.7 72.2 107.3 72.2 115.3" pathLength="1" stroke="#28d7c5"/><circle cx="50.6" cy="93.7" r="9" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="50.6" cy="93.7" r="2.7" fill="#4f6f6e"/><circle cx="29" cy="124.3" r="9" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="29" cy="124.3" r="2.7" fill="#4f6f6e"/><circle cx="50.6" cy="124.3" r="9" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="50.6" cy="124.3" r="2.7" fill="#4f6f6e"/><circle class="ag-det ag-nd" c