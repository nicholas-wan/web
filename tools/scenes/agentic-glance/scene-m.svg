<svg class="ag-scene ag-scene--m" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 748.1" role="img" aria-label="An illustrative hunt. From a ransomware report, a supervisor agent splits the hunt among narrow agents, each given only the tools and context its one job needs: forming a hypothesis, writing and running the detection logic, reporting. Agents carry tools and skills. The Detection agent&#39;s first search, for schtasks.exe, comes back empty, and empty does not mean safe: tasks made through the Task Scheduler API never launch schtasks.exe, so the agent asks whether its search could have missed the threat, checks a new query and searches another way, around event 4698, a task being created. That surfaces one unusual task, \WinTaskUpdate, on one host and not in the baseline. The Report agent writes it up with the evidence attached, and only a human analyst makes the call."><rect x=".5" y=".5" width="359" height="747.1" rx="12" fill="#061214" stroke="#24464b"/><g class="ag-head"><g class="ag-logo"><rect x="16" y="11.1" width="18.8" height="18.8" rx="4.7" fill="#0b1b1e" stroke="#24464b"/><g transform="translate(19.2 14.3) scale(0.517)"><path d="M14 2.2A10 10 0 0 1 21.8 10L18.97 10A7.25 7.25 0 0 0 14 5.03ZM21.8 14A10 10 0 0 1 14 21.8L14 18.97A7.25 7.25 0 0 0 18.97 14ZM10 21.8A10 10 0 0 1 2.2 14L5.03 14A7.25 7.25 0 0 0 10 18.97ZM2.2 10A10 10 0 0 1 10 2.2L10 5.03A7.25 7.25 0 0 0 5.03 10Z"/><path d="M12 6L18 12L12 18L6 12Z"/></g></g><text x="40.8" y="25" font-size="13" font-weight="700" fill="#d8e6e4">Agentic Threat Hunting</text><text x="16" y="46" font-size="12.5" fill="#b4c6c4">From a ransomware report to one lead</text><text x="344" y="25" text-anchor="end" font-size="11" fill="#8ba7a6">T1053.005</text></g><path d="M16 60 H344" stroke="#1b3437"/><g class="ag-s ag-s0"><g class="ag-p ag-p0"><g transform="translate(14 157.2) scale(1.4)"><path d="M84 -9.2 C84 -1.1999999999999993 24 1 24 9" stroke="#4f6f6e"/><path d="M84 -9.2 C84 -1.1999999999999993 84 1 84 9" str