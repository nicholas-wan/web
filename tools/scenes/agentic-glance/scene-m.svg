<svg class="ag-scene ag-scene--m" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 392" role="img" aria-label="An illustrative hunt, in three steps. From a ransomware report, AI agents search for a scheduled-task persistence technique; the first search, for schtasks.exe, comes back empty. Empty is not the same as clear: tasks made through the Task Scheduler API never launch schtasks.exe, so the Detection agent re-plans around event 4698, a task being created. That finds one unusual task, \WinTaskUpdate, on one host and not in the baseline, and a human analyst makes the call."><rect x=".5" y=".5" width="359" height="391" rx="12" fill="#061214" stroke="#24464b"/><g class="ag-head"><g class="ag-i" transform="translate(16 11) scale(1.05)" stroke="#7f9b9a"><path d="M3 1.6h4l2.2 2.2v6.6H3z"/><path d="M4.6 5.6h3M4.6 7.6h3"/></g><text x="32" y="21" font-size="12.5" font-weight="700" fill="#d8e6e4">Ransomware report</text><text x="344" y="21" text-anchor="end" font-size="11.5" fill="#7f9b9a">T1053.005 · Scheduled Task</text></g><path d="M16 32 H344" stroke="#1b3437"/><g class="ag-s ag-s0"><g class="ag-p ag-p0"><path d="M38.1 87.9 C38.1 95.9 20.5 89 20.5 97" stroke="#4f6f6e"/><path d="M38.1 87.9 C38.1 95.9 38.1 89 38.1 97" stroke="#4f6f6e"/><path d="M38.1 87.9 C38.1 95.9 55.7 89 55.7 97" stroke="#4f6f6e"/><path class="ag-c ag-c1" d="M38.1 87.9 C38.1 95.9 55.7 89 55.7 97" pathLength="1" stroke="#28d7c5"/><circle cx="38.1" cy="81.4" r="6.5" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="38.1" cy="81.4" r="1.9" fill="#4f6f6e"/><circle cx="20.5" cy="103.5" r="6.5" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="20.5" cy="103.5" r="1.9" fill="#4f6f6e"/><circle cx="38.1" cy="103.5" r="6.5" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="38.1" cy="103.5" r="1.9" fill="#4f6f6e"/><g class="ag-det"><circle class="ag-nd" cx="55.7" cy="103.5" r="6.5" fill="#28d7c5" stroke="#28d7c5"/><circle class="ag-ndd" cx="55.7" cy="103.5" r="1.9" fill="#061214"/></g></g><text class="ag-t" x="76" y="60" font-size="13.5" font-weight="700" fill="#d8e6e4"><tspan fill="#7f9b9a" font-size="11.5">1</tspan><tspan dx="7">Search</tspan></text><text x="76" y="78" font-size="13.2" font-weight="400" fill="#a9bcba">AI agents turn the report into searches.</text><text x="76" y="94" font-size="13.2" font-weight="400" fill="#a9bcba">The first comes back empty.</text><text class="ag-ev ag-ev0 ag-m" x="76" y="113" font-size="12.5" fill="#7f9b9a">process = schtasks.exe</text><text class="ag-evr ag-evr0" x="76" y="130.5" font-size="12.5" font-weight="600" fill="#d8e6e4">0 results</text></g><path d="M14 152 H346" stroke="#1b3437"/><g class="ag-s ag-s1"><g class="ag-p ag-p1"><g class=""><circle class="ag-nd" cx="32.1" cy="217.9" r="8.1" fill="#28d7c5" stroke="#28d7c5"/><circle class="ag-ndd" cx="32.1" cy="217.9" r="2.4" fill="#061214"/></g><path class="ag-loop" d="M40.2 203.9 A16.1 16.1 0 1 1 16.8 213.1" pathLength="1" stroke="#28d7c5" stroke-width="1.6"/><path class="ag-lh" d="M11.8 207.6 L16.8 213.1 L22.8 210.1" stroke="#28d7c5" stroke-width="1.6"/></g><text class="ag-t" x="76" y="176" font-size="13.5" font-weight="700" fill="#d8e6e4"><tspan fill="#28d7c5" font-size="11.5">2</tspan><tspan dx="7">Re-plan</tspan></text><text x="76" y="194" font-size="13.2" font-weight="400" fill="#a9bcba">Empty doesn&#39;t mean safe. The agent</text><text x="76" y="210" font-size="13.2" font-weight="400" fill="#a9bcba">checks whether its search could even</text><text x="76" y="226" font-size="13.2" font-weight="400" fill="#a9bcba">see the threat, then tries another way.</text><text class="ag-ev ag-ev1 ag-m" x="76" y="245" font-size="12.5" fill="#7f9b9a">event 4698</text><text class="ag-evr ag-evr1" x="76" y="262.5" font-size="12.5" font-weight="400" fill="#7f9b9a">a task being created</text></g><path d="M14 268 H346" stroke="#1b3437"/><g class="ag-s ag-s2"><g class="ag-p ag-p2"><g class="ag-flag" stroke-width="0.9"><g class="ag-i" transform="translate(16 325.2) scale(1.4)" stroke="#28d7c5"><path d="M3 10.6V1.9h6L7.6 4.1 9 6.3H3"/></g></g><path class="ag-he" d="M35.3 333.9 H49.599999999999994" stroke="#28d7c5" stroke-width="1.3" stroke-dasharray="4 3" stroke-linecap="round"/><g class="ag-ana"><circle cx="61.699999999999996" cy="333.9" r="8.1" fill="#0b1b1e" stroke="#ffb869" stroke-width="1.3"/><g class="ag-i" transform="translate(54.8 327) scale(1.2)" stroke="#ffb869"><circle cx="6" cy="4" r="2"/><path d="M2.3 10.6c.6-2 2-3 3.7-3s3.1 1 3.7 3"/></g></g></g><text class="ag-t" x="76" y="292" font-size="13.5" font-weight="700" fill="#d8e6e4"><tspan fill="#ffb869" font-size="11.5">3</tspan><tspan dx="7">Hand off</tspan></text><text x="76" y="310" font-size="13.2" font-weight="400" fill="#a9bcba">One unusual task on one computer.</text><text x="76" y="326" font-size="13.2" font-weight="400" fill="#a9bcba">A human analyst makes the call.</text><text class="ag-ev ag-ev2 ag-m" x="76" y="345" font-size="12.5" fill="#7f9b9a">\WinTaskUpdate</text><text class="ag-evr ag-evr2" x="76" y="362.5" font-size="12.5" font-weight="400" fill="#7f9b9a">1 host · not in baseline</text></g></svg>