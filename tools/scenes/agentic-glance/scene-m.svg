<svg class="ag-scene ag-scene--m" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" role="img" aria-label="An illustrative hunt. From a ransomware report, a supervisor agent splits the hunt among narrow agents, each given only the tools and context its one job needs: forming a hypothesis, writing and running the detection logic, reporting. Agents carry tools and skills. The Detection agent&#39;s first search, for schtasks.exe, comes back empty, and empty does not mean safe: tasks made through the Task Scheduler API never launch schtasks.exe, so the agent asks whether its search could have missed the threat, checks a new query and searches another way, around event 4698, a task being created. That surfaces one unusual task, \WinTaskUpdate, on one host and not in the baseline. The Report agent writes it up with the evidence attached, and only a human analyst makes the call."><rect x=".5" y=".5" width="359" height="343" rx="12" fill="#061214" stroke="#24464b"/><g class="ag-head"><g class="ag-i" transform="translate(16 11) scale(1.05)" stroke="#8ba7a6"><path d="M3 1.6h4l2.2 2.2v6.6H3z"/><path d="M4.6 5.6h3M4.6 7.6h3"/></g><text x="32" y="21" font-size="13" font-weight="700" fill="#d8e6e4">From a ransomware report to one lead</text><text x="344" y="21" text-anchor="end" font-size="11" fill="#8ba7a6">T1053.005</text></g><path d="M16 32 H344" stroke="#1b3437"/><g class="ag-s ag-s0"><g class="ag-p ag-p0"><path d="M52.4 76.7 C52.4 84.7 29 81.3 29 89.3" stroke="#4f6f6e"/><path d="M52.4 76.7 C52.4 84.7 52.4 81.3 52.4 89.3" stroke="#4f6f6e"/><path d="M52.4 76.7 C52.4 84.7 75.8 81.3 75.8 89.3" stroke="#4f6f6e"/><path class="ag-c ag-c0" d="M52.4 76.7 C52.4 84.7 29 81.3 29 89.3" pathLength="1" stroke="#28d7c5"/><path class="ag-c ag-c0r" d="M52.4 76.7 C52.4 84.7 29 81.3 29 89.3" pathLength="1" stroke="#28d7c5"/><path class="ag-c ag-c1" d="M52.4 76.7 C52.4 84.7 52.4 81.3 52.4 89.3" pathLength="1" stroke="#28d7c5"/><path class="ag-c ag-c2" d="M52.4 76.7 C52.4 84.7 75.8 81.3 75.8 89.3" pathLength="1" stroke="#28d7c5"/><circle class="ag-rip ag-rip-det" cx="52.4" cy="98.3" r="9" stroke="#28d7c5" stroke-width="1.4"/><circle cx="52.4" cy="67.7" r="9" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="52.4" cy="67.7" r="2.7" fill="#4f6f6e"/><circle cx="29" cy="98.3" r="9" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="29" cy="98.3" r="2.7" fill="#4f6f6e"/><circle class="ag-det ag-nd" cx="52.4" cy="98.3" r="9" fill="#28d7c5" stroke="#28d7c5"/><circle cx="75.8" cy="98.3" r="9" fill="#0b1b1e" stroke="#4f6f6e"/><circle cx="75.8" cy="98.3" r="2.7" fill="#4f6f6e"/><circle class="ag-det-dot" cx="52.4" cy="98.3" r="2.7" fill="#4f6f6e"/><circle class="ag-fl ag-fl-sup" cx="52.4" cy="67.7" r="9" fill="#28d7c5" fill-opacity=".22" stroke="#28d7c5" stroke-width="1.6"/><circle class="ag-fl ag-fl-hyp" cx="29" cy="98.3" r="9" fill="#28d7c5" fill-opacity=".22" stroke="#28d7c5" stroke-width="1.6"/><circle class="ag-fl ag-fl-rep" cx="75.8" cy="98.3" r="9" fill="#28d7c5" fill-opacity=".22" stroke="#28d7c5" stroke-width="1.6"/></g><text class="ag-t" x="92" y="60" font-size="14" font-weight="700" fill="#d8e6e4"><tspan fill="#28d7c5" font-size="12">1</tspan><tspan dx="7">Purpose-built agents</tspan></text><text x="92" y="78" font-size="13.4" font-weight="400" fill="#b4c6c4">A supervisor splits the hunt among</text><text x="92" y="95" font-size="13.4" font-weight="400" fill="#b4c6c4">narrow agents, each given only the tools</text><text x="92" y="112" font-size="13.4" font-weight="400" fill="#b4c6c4">and context its one job needs.</text></g><path d="M14 134 H346" stroke="#1b3437"/><g class="ag-s ag-s1"><g class="ag-p ag-p1"><circle class="ag-rip ag-rip0" cx="42" cy="180" r="9" stroke="#28d7c5" stroke-width="1.4"/><circle class="ag-rip ag-rip1" cx="42" cy="180" r="9" stroke="#28d7c5" stroke-width="1.4"/><circle class="ag-rip ag-rip2" cx="42" cy="180" r="9" stroke="#28d7c5" stroke-width="1.4"/><circle class="ag-rip ag-rip3" cx="42" cy="180" r="9" stroke="#28d7c5" stroke-width="1.4"/><circle class="ag-fl ag-fl-arr" cx="42" cy="180" r="13" fill="#28d7c5" fill-opacity=".22" stroke="#28d7c5" stroke-width="1.6"/><circle class=" ag-nd" cx="42" cy="180" r="9" fill="#28d7c5" stroke="#28d7c5"/><path class="ag-loop" d="M51.5 163.5 A19 19 0 1 1 23.9 174.3" pathLength="1" stroke="#28d7c5" stroke-width="1.5"/><path class="ag-lh" d="M23.9 174.3 L26.1 182.3 L17.5 179.6 Z" fill="#28d7c5" stroke="#28d7c5" stroke-width="1" stroke-linejoin="round"/><text class="ag-none" x="42" y="213" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b4c6c4">0 found</text><text class="ag-found" x="42" y="213" text-anchor="middle" font-size="10.5" font-weight="700" fill="#28d7c5">1 found</text></g><text class="ag-t" x="92" y="164" font-size="14" font-weight="700" fill="#d8e6e4"><tspan fill="#28d7c5" font-size="12">2</tspan><tspan dx="7">Equipped to adapt</tspan></text><text x="92" y="182" font-size="13.4" font-weight="400" fill="#b4c6c4">The first search comes back empty, but</text><text x="92" y="199" font-size="13.4" font-weight="400" fill="#b4c6c4">empty doesn&#39;t mean safe. The agent asks</text><text x="92" y="216" font-size="13.4" font-weight="400" fill="#b4c6c4">what it missed and searches another way.</text></g><path d="M14 238 H346" stroke="#1b3437"/><g class="ag-s ag-s2"><g class="ag-p ag-p2"><rect class="ag-flag" x="20" y="279.4" width="23.2" height="23.2" rx="3" fill="#0a191c" stroke="#28d7c5" stroke-opacity=".7"/><g class="ag-flag" stroke-width="0.8"><g class="ag-i" transform="translate(22 281.1) scale(1.6)" stroke="#28d7c5"><path d="M3 10.6V1.9h6L7.6 4.1 9 6.3H3"/></g></g><path class="ag-he" d="M46.2 291 H60.2" stroke="#28d7c5" stroke-width="1.3" stroke-dasharray="2 2" stroke-linecap="round"/><circle class="ag-pk" cx="46.2" cy="291" r="2.6" fill="#28d7c5" style="--dx:14px"/><g class="ag-ana"><circle cx="74.5" cy="291" r="11.3" fill="#0b1b1e" stroke="#ffb869" stroke-width="1.5"/><g class="ag-i" transform="translate(64.8 281.3) scale(1.6)" stroke="#ffb869"><circle cx="6" cy="4" r="2"/><path d="M2.3 10.6c.6-2 2-3 3.7-3s3.1 1 3.7 3"/></g></g><circle class="ag-rip ag-halo" cx="74.5" cy="291" r="11.3" stroke="#ffb869" stroke-width="1.4"/></g><text class="ag-t" x="92" y="268" font-size="14" font-weight="700" fill="#d8e6e4"><tspan fill="#ffb869" font-size="12">3</tspan><tspan dx="7">Surface to the analyst</tspan></text><text x="92" y="286" font-size="13.4" font-weight="400" fill="#b4c6c4">Agents surface what looks suspicious,</text><text x="92" y="303" font-size="13.4" font-weight="400" fill="#b4c6c4">evidence attached. Only a human analyst</text><text x="92" y="320" font-size="13.4" font-weight="400" fill="#b4c6c4">makes the call.</text></g></svg>