name: Build and deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The browser tests are split across three runners that run at once
  # (PW_SPLIT, tools/tests/browser/playwright.config.cjs). On one runner they
  # took about 6 of the run's 7.5 minutes. Each runner builds and verifies
  # dist/ itself (about 20 s), so none waits on another; split a also uploads
  # the Pages artifact, and deploy waits for all three.
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        split: [a, b, c]
    env:
      PW_SPLIT: ${{ matrix.split }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and verify static site
        shell: powershell
        run: .\tools\site.ps1 check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/tests/browser/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/tests/browser/package-lock.json') }}

      - name: Install rendered layout checks
        working-directory: tools/tests/browser
        run: |
          npm ci
          npx playwright install chromium webkit

      - name: Check search and lightbox logic
        if: matrix.split == 'a'
        working-directory: tools/tests/browser
        run: npm run test:unit

      - name: Check travel search and layouts before publishing (split ${{ matrix.split }})
        working-directory: tools/tests/browser
        run: npm test

      - name: Save failed layout screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: travel-layout-failures-${{ matrix.split }}
          path: tools/tests/browser/test-results
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        if: matrix.split == 'a'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: matrix.split == 'a'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
