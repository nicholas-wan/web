name: Build and deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and verify static site
        shell: powershell
        run: .\tools\site.ps1 check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/tests/browser/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/tests/browser/package-lock.json') }}

      - name: Install rendered layout checks
        working-directory: tools/tests/browser
        run: |
          npm ci
          npx playwright install chromium webkit

      - name: Check search and lightbox logic
        working-directory: tools/tests/browser
        run: npm run test:unit

      - name: Check travel search and layouts before publishing
        working-directory: tools/tests/browser
        run: npm test

      - name: Save failed layout screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: travel-layout-failures
          path: tools/tests/browser/test-results
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Pages builds each ETag from the file's mtime and size, and the build
      # writes every file anew, so each deploy changed every ETag and returning
      # visitors re-downloaded unchanged images and fonts in full. A time taken
      # from the file's content keeps an unchanged file's ETag (a 304) and
      # changes it when the content does. The archive step keeps mtimes.
      - name: Pin file times to content so unchanged files keep their ETag
        shell: powershell
        run: |
          $sha = [Security.Cryptography.SHA256]::Create()
          $base = [DateTime]::new(2001, 1, 1, 0, 0, 0, [DateTimeKind]::Utc)
          foreach ($f in [IO.Directory]::EnumerateFiles((Resolve-Path dist).Path, '*', 'AllDirectories')) {
            $h = $sha.ComputeHash([IO.File]::ReadAllBytes($f))
            [IO.File]::SetLastWriteTimeUtc($f, $base.AddSeconds([BitConverter]::ToUInt32($h, 0) -band 0x0FFFFFFF))
          }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
