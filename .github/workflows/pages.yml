name: Build and deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and verify static site
        shell: powershell
        run: .\tools\site.ps1 check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install rendered layout checks
        working-directory: tools/tests/browser
        run: |
          npm ci
          npx playwright install chromium

      - name: Check travel layouts before publishing
        working-directory: tools/tests/browser
        run: npm test

      - name: Save failed layout screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: travel-layout-failures
          path: tools/tests/browser/test-results
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
